<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Local Chat Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101114;
        --panel: #181a20;
        --panel-2: #111319;
        --line: #2a2d36;
        --text: #f2f4f8;
        --muted: #a9afbd;
        --claude: #d97745;
        --codex: #4f9cff;
        --maher: #63d08c;
        --other: #b7a6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      textarea,
      input {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
      }

      button {
        padding: 8px 12px;
        cursor: pointer;
      }

      button:hover,
      .conversation:hover {
        border-color: #555b68;
      }

      .app {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        height: 100vh;
      }

      aside {
        display: grid;
        grid-template-rows: auto 1fr;
        min-width: 0;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }

      .sidebarHeader {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }

      #conversationList {
        overflow-y: auto;
        padding: 8px;
      }

      .conversation {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 6px;
        align-items: center;
        width: 100%;
        margin-bottom: 6px;
        padding: 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        text-align: left;
      }

      .conversation.active {
        border-color: #4f9cff;
        background: #172033;
      }

      .conversationName {
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .renameButton,
      .deleteButton {
        padding: 4px 7px;
        color: var(--muted);
      }

      .deleteButton:hover {
        border-color: #b95050;
        color: #ff9d9d;
      }

      main {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        min-width: 0;
        height: 100vh;
      }

      header,
      form {
        display: flex;
        gap: 10px;
        padding: 12px;
        background: var(--panel);
        border-color: var(--line);
      }

      header {
        border-bottom: 1px solid var(--line);
      }

      #currentTitle {
        flex: 1;
        min-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }

      #importStatus {
        padding: 0 12px 8px;
        min-height: 20px;
        color: var(--muted);
        font-size: 12px;
        background: var(--panel);
      }

      #setupPanel {
        display: none;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        background: #221c13;
        color: #ffd9a8;
        font-size: 13px;
      }

      #setupPanel.open {
        display: flex;
      }

      #setupText {
        flex: 1;
      }

      #messages {
        overflow-y: auto;
        padding: 18px 12px 24px;
      }

      .message {
        max-width: 900px;
        margin: 0 auto 14px;
        padding-left: 12px;
        border-left: 3px solid var(--other);
      }

      .message.claude {
        border-color: var(--claude);
      }

      .message.codex {
        border-color: var(--codex);
      }

      .message.maher {
        border-color: var(--maher);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .author {
        font-weight: 700;
        text-transform: lowercase;
      }

      .claude .author {
        color: var(--claude);
      }

      .codex .author {
        color: var(--codex);
      }

      .maher .author {
        color: var(--maher);
      }

      .text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      form {
        border-top: 1px solid var(--line);
      }

      .attachWrap {
        position: relative;
        align-self: flex-end;
      }

      #attachButton {
        width: 42px;
        height: 42px;
        padding: 0;
        font-size: 24px;
        line-height: 1;
      }

      #attachMenu {
        position: absolute;
        left: 0;
        bottom: calc(100% + 8px);
        display: none;
        min-width: 150px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        box-shadow: 0 12px 30px rgb(0 0 0 / 35%);
        z-index: 10;
      }

      #attachMenu.open {
        display: grid;
        gap: 6px;
      }

      #attachMenu button {
        width: 100%;
        text-align: left;
      }

      textarea {
        flex: 1;
        min-height: 42px;
        max-height: 140px;
        padding: 9px 10px;
        resize: vertical;
      }

      @media (max-width: 720px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        aside {
          max-height: 220px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        main {
          height: auto;
          min-height: 0;
        }

        header {
          flex-wrap: wrap;
        }

      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="sidebarHeader">
          <h1>Conversations</h1>
          <button id="newButton" type="button">New</button>
        </div>
        <nav id="conversationList" aria-label="Conversations"></nav>
      </aside>

      <main>
        <header>
          <div id="currentTitle"></div>
        </header>
        <div id="setupPanel">
          <div id="setupText"></div>
          <button id="setupButton" type="button">Run Checks</button>
        </div>
        <div id="importStatus" role="status" aria-live="polite"></div>

        <section id="messages" aria-live="polite"></section>

        <form id="sendForm">
          <div class="attachWrap">
            <button id="attachButton" type="button" title="Add files to memory" aria-label="Add files to memory">+</button>
            <div id="attachMenu" role="menu" aria-label="Add to memory">
              <button id="attachFileButton" type="button" role="menuitem">Choose file</button>
              <button id="attachFolderButton" type="button" role="menuitem">Choose folder</button>
            </div>
          </div>
          <textarea id="messageInput" placeholder="Write a message..." rows="1"></textarea>
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const conversationList = document.getElementById("conversationList");
      const currentTitle = document.getElementById("currentTitle");
      const newButton = document.getElementById("newButton");
      const attachButton = document.getElementById("attachButton");
      const attachMenu = document.getElementById("attachMenu");
      const attachFileButton = document.getElementById("attachFileButton");
      const attachFolderButton = document.getElementById("attachFolderButton");
      const setupPanel = document.getElementById("setupPanel");
      const setupText = document.getElementById("setupText");
      const setupButton = document.getElementById("setupButton");
      const importStatus = document.getElementById("importStatus");
      const messages = document.getElementById("messages");
      const sendForm = document.getElementById("sendForm");
      const messageInput = document.getElementById("messageInput");
      const timeFormatter = new Intl.DateTimeFormat(undefined, {
        dateStyle: "short",
        timeStyle: "medium",
      });

      let currentFile = "";
      let conversationFiles = [];

      function describeSetup(result) {
        const missing = [];
        if (!result.checks.logsWritable) missing.push("writable log folder");
        if (!result.checks.claudeFound) missing.push("Claude CLI on PATH");
        if (!result.checks.codexFound) missing.push("Codex CLI on PATH");
        if (!result.checks.claudeProbe) missing.push("Claude login probe");
        if (!result.checks.codexProbe) missing.push("Codex login probe");
        return missing.length ? `Setup needed: ${missing.join(", ")}.` : "Setup checks passed.";
      }

      async function loadSetupStatus() {
        const response = await fetch("/api/setup");
        const result = await response.json();
        if (!result.required || result.complete) {
          setupPanel.classList.remove("open");
          return;
        }

        setupText.textContent = describeSetup(result);
        setupPanel.classList.add("open");
      }

      function displayName(fileName) {
        return fileName.replace(/\.jsonl$/i, "");
      }

      function formatTime(value) {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : timeFormatter.format(date);
      }

      function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
      }

      function renderConversationList() {
        conversationList.replaceChildren();

        for (const file of conversationFiles) {
          const item = document.createElement("div");
          item.className = `conversation${file === currentFile ? " active" : ""}`;
          item.title = displayName(file);

          const name = document.createElement("button");
          name.type = "button";
          name.className = "conversationName";
          name.textContent = displayName(file);
          name.addEventListener("click", () => selectFile(file));

          const rename = document.createElement("button");
          rename.type = "button";
          rename.className = "renameButton";
          rename.textContent = "Edit";
          rename.addEventListener("click", () => renameConversation(file));

          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "deleteButton";
          deleteButton.textContent = "Delete";
          deleteButton.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteConversation(file);
          });

          item.append(name, rename, deleteButton);
          conversationList.append(item);
        }
      }

      function renderMessage(message) {
        const row = document.createElement("article");
        row.className = `message ${message.author.toLowerCase()}`;

        const meta = document.createElement("div");
        meta.className = "meta";

        const author = document.createElement("span");
        author.className = "author";
        author.textContent = message.author;

        const time = document.createElement("time");
        time.dateTime = message.time;
        time.textContent = formatTime(message.time);

        const text = document.createElement("div");
        text.className = "text";
        text.textContent = message.text;

        meta.append(author, time);
        row.append(meta, text);
        messages.append(row);
      }

      async function loadFiles(preferredFile) {
        const response = await fetch("/api/files");
        conversationFiles = await response.json();
        const nextFile = preferredFile || currentFile || conversationFiles[0] || "";

        renderConversationList();

        if (nextFile) {
          if (nextFile !== currentFile) {
            await selectFile(nextFile);
          } else {
            currentTitle.textContent = displayName(currentFile);
          }
        } else {
          currentFile = "";
          currentTitle.textContent = "";
          messages.replaceChildren();
        }
      }

      async function selectFile(fileName) {
        currentFile = fileName;
        currentTitle.textContent = displayName(fileName);
        renderConversationList();
        socket.emit("select", fileName);

        const response = await fetch(`/api/conversations/${encodeURIComponent(fileName)}`);
        const loadedMessages = await response.json();
        messages.replaceChildren();
        loadedMessages.forEach(renderMessage);
        scrollToBottom();
      }

      async function renameConversation(fileName) {
        const nextName = prompt("Conversation name", displayName(fileName));
        if (nextName === null) return;

        const response = await fetch(`/api/conversations/${encodeURIComponent(fileName)}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: nextName }),
        });
        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Could not rename conversation");
          return;
        }

        await loadFiles(data.file);
      }

      async function deleteConversation(fileName) {
        const fileIndex = conversationFiles.indexOf(fileName);
        const fallbackFile =
          conversationFiles[fileIndex + 1] || conversationFiles[fileIndex - 1] || "";

        if (!confirm(`Move "${displayName(fileName)}" to trash?`)) return;

        importStatus.textContent = `Moving "${displayName(fileName)}" to trash...`;

        let response;
        let data;
        try {
          response = await fetch(`/api/conversations/${encodeURIComponent(fileName)}`, {
            method: "DELETE",
          });
          data = await response.json().catch(() => ({}));
        } catch {
          importStatus.textContent = "Could not delete conversation";
          alert("Could not delete conversation");
          return;
        }

        if (!response.ok) {
          const message = data.error || "Could not delete conversation";
          importStatus.textContent = message;
          alert(message);
          return;
        }

        const filesResponse = await fetch("/api/files");
        const files = await filesResponse.json();
        importStatus.textContent = `Moved "${displayName(fileName)}" to trash.`;

        if (files.length) {
          await loadFiles(files.includes(fallbackFile) ? fallbackFile : files[0]);
          return;
        }

        const createResponse = await fetch("/api/conversations", { method: "POST" });
        const created = await createResponse.json();
        await loadFiles(created.file);
      }

      newButton.addEventListener("click", async () => {
        const response = await fetch("/api/conversations", { method: "POST" });
        const data = await response.json();
        await loadFiles(data.file);
      });

      setupButton.addEventListener("click", async () => {
        setupButton.disabled = true;
        setupText.textContent = "Running setup checks...";
        try {
          const response = await fetch("/api/setup/run", { method: "POST" });
          const result = await response.json();
          setupText.textContent = describeSetup(result);
          if (result.complete) {
            setupPanel.classList.remove("open");
            importStatus.textContent = "Setup checks passed. Automation is enabled.";
          }
        } catch {
          setupText.textContent = "Could not run setup checks.";
        } finally {
          setupButton.disabled = false;
        }
      });

      function setAttachBusy(isBusy) {
        attachButton.disabled = isBusy;
        attachFileButton.disabled = isBusy;
        attachFolderButton.disabled = isBusy;
      }

      function closeAttachMenu() {
        attachMenu.classList.remove("open");
      }

      function ensurePickerSupport(kind) {
        const apiName = kind === "folder" ? "showDirectoryPicker" : "showOpenFilePicker";
        if (typeof window[apiName] !== "function") {
          importStatus.textContent = "File picker requires Edge or Chrome on localhost.";
          return false;
        }
        return true;
      }

      async function fileEntryFromFile(file, relativePath) {
        return {
          path: relativePath || file.webkitRelativePath || file.name,
          content: await file.text(),
        };
      }

      async function collectDirectoryFiles(directoryHandle) {
        const files = [];

        async function visit(handle, prefix, depth) {
          if (depth > 4 || files.length >= 20) return;

          for await (const [name, child] of handle.entries()) {
            if (files.length >= 20) return;
            const relativePath = prefix ? `${prefix}/${name}` : name;

            if (child.kind === "directory") {
              await visit(child, relativePath, depth + 1);
            } else if (child.kind === "file") {
              const file = await child.getFile();
              files.push(await fileEntryFromFile(file, relativePath));
            }
          }
        }

        await visit(directoryHandle, "", 0);
        return files;
      }

      async function postImportedFiles(rootName, files) {
        if (!currentFile || !files.length) return;

        setAttachBusy(true);
        importStatus.textContent = "Importing selected memory...";

        try {
          const response = await fetch(`/api/conversations/${encodeURIComponent(currentFile)}/import-files`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ rootName, files }),
          });
          const data = await response.json();

          if (!response.ok) {
            importStatus.textContent = data.error || "Could not import selected files";
            return;
          }

          importStatus.textContent = `Imported ${data.imported.length} file${data.imported.length === 1 ? "" : "s"} into conversation memory.`;
        } catch {
          importStatus.textContent = "Could not import selected files";
        } finally {
          setAttachBusy(false);
          messageInput.focus();
        }
      }

      attachButton.addEventListener("click", () => {
        attachMenu.classList.toggle("open");
      });

      attachFileButton.addEventListener("click", async () => {
        closeAttachMenu();
        if (!currentFile || !ensurePickerSupport("file")) return;

        try {
          const handles = await window.showOpenFilePicker({ multiple: true });
          const files = [];
          for (const handle of handles) {
            const file = await handle.getFile();
            files.push(await fileEntryFromFile(file, file.name));
          }
          await postImportedFiles("Selected files", files);
        } catch (error) {
          if (error && error.name !== "AbortError") {
            importStatus.textContent = "Could not read selected files";
          }
        }
      });

      attachFolderButton.addEventListener("click", async () => {
        closeAttachMenu();
        if (!currentFile || !ensurePickerSupport("folder")) return;

        try {
          const directoryHandle = await window.showDirectoryPicker({ mode: "read" });
          const files = await collectDirectoryFiles(directoryHandle);
          await postImportedFiles(directoryHandle.name, files);
        } catch (error) {
          if (error && error.name !== "AbortError") {
            importStatus.textContent = "Could not read selected folder";
          }
        }
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".attachWrap")) {
          closeAttachMenu();
        }
      });

      messageInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || event.shiftKey) return;
        event.preventDefault();
        sendForm.requestSubmit();
      });

      sendForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = messageInput.value.trim();
        if (!text || !currentFile) return;

        await fetch(`/api/conversations/${encodeURIComponent(currentFile)}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        messageInput.value = "";
        messageInput.focus();
      });

      socket.on("message", ({ file, message }) => {
        if (file !== currentFile) return;
        renderMessage(message);
        scrollToBottom();
      });

      socket.on("files", async (files) => {
        const selected = currentFile;
        conversationFiles = files;
        renderConversationList();

        if (files.includes(selected)) {
          currentTitle.textContent = displayName(selected);
        } else if (files.length) {
          await selectFile(files[0]);
        } else {
          currentFile = "";
          currentTitle.textContent = "";
          messages.replaceChildren();
        }
      });

      loadSetupStatus();
      loadFiles();
    </script>
  </body>
</html>
